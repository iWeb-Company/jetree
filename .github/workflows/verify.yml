name: Verify Jetree
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_call:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-ci-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Verify deployment failure and rollback behavior
        run: |
          bash -n scripts/deploy-vps.sh scripts/deploy-ssh.sh tests/integration/deploy-rollback.sh
          sudo --preserve-env=CI,GITHUB_ACTIONS bash tests/integration/deploy-rollback.sh
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Verify HTTP authentication boundaries
        run: |
          npm start -- --hostname 127.0.0.1 --port 3057 > /tmp/jetree-smoke.log 2>&1 &
          jetree_pid=$!
          trap 'kill "$jetree_pid"' EXIT
          node tests/integration/auth-smoke.mjs
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: jetree_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: jetree_test
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic Auth contract
        run: psql -X -v ON_ERROR_STOP=1 -f tests/database/bootstrap.sql
      - name: Apply every migration in order
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify department isolation and private credentials
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/database/isolation.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/remote-isolation.sql
      - name: Replay the audited existing schema and reconcile
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'create database jetree_replay'
          export PGDATABASE=jetree_replay
          tail -n +5 tests/database/bootstrap.sql | psql -X -v ON_ERROR_STOP=1
          psql -X -v ON_ERROR_STOP=1 -f tests/database/remote-001-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/seed-existing.sql
          psql -X -v ON_ERROR_STOP=1 --single-transaction -f supabase/reconciliation/20261006145142_reconcile_existing_001.sql
          for migration in supabase/migrations/00[2-8]*.sql; do
            psql -X -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
          done
          psql -X -v ON_ERROR_STOP=1 -f tests/database/verify-seed.sql


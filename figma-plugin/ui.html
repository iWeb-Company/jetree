<!doctype html><html lang="es"><meta charset="utf-8"><style>
body{font:13px system-ui;background:#080c14;color:#e5e7eb;padding:16px}h2{color:#67e8f9}label{display:block;margin:14px 0 5px}input,select,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #164e63;border-radius:8px;background:#111827;color:white}button{margin-top:12px;background:#155e75;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}#status{white-space:pre-wrap;color:#a5f3fc}.small{font-size:11px;color:#9ca3af}
</style><h2>Jetree · Agentes</h2><p>Los cambios necesitan aprobación en Jetree. Dejá este plugin abierto para aplicarlos.</p>
<label for="server">Entorno</label><select id="server"><option value="https://jetree-dev.iwebtecnology.com">Jetree dev</option><option value="https://jetree.iwebtecnology.com">Jetree producción</option></select>
<label for="code">Código de vinculación del archivo</label><input id="code" type="password" autocomplete="off" placeholder="Desde Conectores → Figma"><button id="pair">Vincular este archivo</button>
<p id="file"></p><button id="verify" hidden>Guardé el archivo: verificar y comenzar</button><button id="stop" hidden>Pausar recepción</button><p id="status" role="status">Sin vincular.</p><p class="small">La vinculación vence en 24 horas. Si cerrás Figma, los nuevos cambios esperan en Jetree. No cierres el plugin mientras aplica un cambio.</p>
<script>
const el=id=>document.getElementById(id);let token='',marker='',origin='',busy=false,applying=false,paused=true,pending=null,timer=null;
const status=text=>el('status').textContent=text;
async function request(body){const response=await fetch(origin+'/api/figma/plugin',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});const result=await response.json();if(!response.ok){const error=new Error(result.error||'Sin conexión con Jetree.');error.code=result.code;throw error;}return result;}
function schedule(){clearTimeout(timer);if((!paused||pending)&&!applying)timer=setTimeout(poll,5000);}
async function poll(){if(busy||applying||(paused&&!pending))return;busy=true;try{if(pending){await request(pending);pending=null;}if(paused)return;const result=await request({action:'claim'});if(result.job){applying=true;status('Aplicando: '+result.job.summary);parent.postMessage({pluginMessage:{type:'apply',job:result.job,marker}},'*');return;}status('Conectado. Esperando cambios aprobados.');}catch(error){status(error.message);if(error.code==='AUTH_REQUIRED'){paused=true;pending=null;status('La vinculación venció o fue revocada. Revisá cualquier cambio en curso en Figma antes de generar un código nuevo.');}}finally{busy=false;schedule();}}
el('pair').onclick=async()=>{if(busy||applying||pending)return;paused=true;busy=true;origin=el('server').value;token='';try{const result=await request({action:'pair_start',code:el('code').value.trim()});token=result.token;marker=result.marker;el('code').value='';el('file').textContent='Archivo autorizado: '+result.name+' ('+result.fileKey+'). Confirmá que es el archivo abierto.';el('verify').hidden=false;parent.postMessage({pluginMessage:{type:'bind',marker}},'*');status('Guardá el archivo en Figma y verificá la vinculación. Puede demorar unos segundos en sincronizar.');}catch(error){status(error.message);}finally{busy=false;}};
el('verify').onclick=async()=>{if(busy)return;busy=true;try{await request({action:'verify'});paused=false;el('verify').hidden=true;el('stop').hidden=false;status('Archivo verificado. Recibiendo cambios.');schedule();}catch(error){status(error.message);}finally{busy=false;}};
el('stop').onclick=()=>{paused=!paused;el('stop').textContent=paused?'Reanudar recepción':'Pausar recepción';status(paused?'Recepción pausada. Un cambio en curso seguirá hasta finalizar.':'Recepción activa.');schedule();};
onmessage=async(event)=>{const msg=event.data.pluginMessage;if(!msg||msg.type!=='outcome'||!applying)return;applying=false;let preview; if(Array.isArray(msg.preview)){let binary='';for(let i=0;i<msg.preview.length;i+=8192)binary+=String.fromCharCode(...msg.preview.slice(i,i+8192));preview=btoa(binary);}pending={action:'complete',jobId:msg.jobId,status:msg.status,result:msg.result,preview};if(msg.status==='uncertain')paused=true;busy=true;try{await request(pending);pending=null;status(msg.status==='applied'?'Cambio aplicado y registrado.':msg.result.detail);if(msg.status==='uncertain')status('Cambio incierto: revisá el archivo, cerrá el plugin y resolvelo en Jetree.');}catch(error){status('El resultado no se pudo registrar. Se reintentará informar, sin repetir la edición. '+error.message);}finally{busy=false;schedule();}};
</script></html>

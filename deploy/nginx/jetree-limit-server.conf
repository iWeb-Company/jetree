# Include inside the HTTPS server block for Jetree only.
limit_req zone=jetree_api burst=30 nodelay;
limit_req zone=jetree_chat burst=3 nodelay;
limit_req zone=jetree_oauth burst=5 nodelay;
limit_req_status 429;
error_page 429 = @jetree_rate_limited;
location @jetree_rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    return 429 '{"error":"Demasiadas solicitudes. Esperá un minuto y volvé a intentar."}';
}

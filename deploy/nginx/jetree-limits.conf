# Include once in the nginx http context. Only servers that opt into limit_req
# use these zones. Each hostname has an independent bucket per source address.
map $uri $jetree_api_key {
    default "";
    ~^/api/(?!health(?:/|$)|telegram/worker(?:/|$)|webhook/telegram(?:/|$)|tool-connections/oauth/callback(?:/|$)) "$server_name:$binary_remote_addr";
}
map "$request_method:$uri" $jetree_chat_key {
    default "";
    "POST:/api/agents/chat" "$server_name:$binary_remote_addr";
}
map "$request_method:$uri" $jetree_oauth_key {
    default "";
    "POST:/api/tool-connections/oauth" "$server_name:$binary_remote_addr";
}
limit_req_zone $jetree_api_key zone=jetree_api:10m rate=5r/s;
limit_req_zone $jetree_chat_key zone=jetree_chat:10m rate=12r/m;
limit_req_zone $jetree_oauth_key zone=jetree_oauth:10m rate=10r/m;
